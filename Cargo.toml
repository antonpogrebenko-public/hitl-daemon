[package]
name = "hitl-daemon"
version = "0.23.2"
edition = "2021"
description = "Hardware-in-the-loop simulator daemon for UAV testing"
license = "MIT"

[dependencies]
mavlink-io = { path = "crates/mavlink-io" }
protocol = { path = "crates/protocol" }
simulation = { path = "crates/simulation" }
terrain = { path = "crates/terrain" }
websocket = { path = "crates/websocket" }
hitl-physics = { path = "../hitl-physics" }
hitl-sensors = { path = "../hitl-sensors" }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = "0.2.3"
ratatui = "0.28"
crossterm = "0.28"
atty = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { workspace = true }
crossbeam-channel = { workspace = true }
mavlink = { workspace = true }
serde = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"

[workspace]
resolver = "2"
members = [".", "crates/mavlink-io", "crates/protocol", "crates/simulation", "crates/terrain", "crates/websocket"]

[workspace.dependencies]
tokio = { version = "1.37", features = ["full"] }
serialport = "4.3"
mavlink = { version = "0.13", features = ["ardupilotmega"] }
tokio-serial = "5.4"
nalgebra = "0.33"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
clap = { version = "=4.4.18", features = ["derive"] }
crossbeam-channel = "0.5"
parking_lot = "0.12"
spin_sleep = "1.2"
axum = "0.7"
tokio-tungstenite = "0.23"
tower-http = { version = "0.5", features = ["cors"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1.0"

[profile.release]
# Thin LTO so the small hot functions in hitl-physics and hitl-sensors can
# inline across the crate boundary. Disassembling the shipped binary showed
# `GaussMarkov::step` called out of line six times per IMU sample and
# `max_motor_speed_from_voltage` likewise — the default `lto = false` with 16
# codegen units is what kept them separate.
#
# Bit-identical for floating point: Rust enables neither FP contraction nor
# fast-math, so LTO cannot change an f64 result.
lto = "thin"
